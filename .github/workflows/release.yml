name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        run: |
          gh release view "${{ github.ref_name }}" 2>/dev/null || \
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    name: Build ${{ matrix.asset_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: rewindr-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: rewindr-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: rewindr-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: rewindr-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: cli

      - name: Package
        run: |
          cp cli/target/${{ matrix.target }}/release/rewindr rewindr
          strip rewindr 2>/dev/null || true
          tar czf ${{ matrix.asset_name }}.tar.gz rewindr

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset_name }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
