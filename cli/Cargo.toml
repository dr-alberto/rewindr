[package]
name = "rewindr"
version = "0.1.0"
edition = "2024"
description = "Rebuild and debug failed GitHub Actions CI environments locally"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "native-tls-vendored"] }
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zip = "8.6.0"
