name: "Rewindr CI Replay"
description: "Capture a failed GitHub Actions job and rebuild its environment locally to debug it in a shell."

inputs:
  github-token:
    description: "The GITHUB_TOKEN to use for uploading artifacts"
    required: true
    default: ${{ github.token }}
  secrets:
    description: "JSON object of the workflow secrets (set it to the toJSON(secrets) expression) so rewindr can redact secret values from the captured environment. If omitted, environment variables are not captured."
    required: false
    default: ""
runs:
  using: "node24"
  main: "dist/main/index.js"
  post: "dist/post/index.js"
  post-if: failure()
